name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.85.0
      - name: Validate tag and package versions
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          cargo_version="$(cargo metadata --no-deps --format-version 1 | jq -r '.packages[] | select(.name == "hyperion-capture") | .version')"
          decky_version="$(jq -r '.version' packaging/decky/package.json)"
          flatpak_version="$(sed -n 's/.*<release version="\([^"]*\)".*/\1/p' packaging/flatpak/io.github.PatrikTheDev.HyperionCapture.metainfo.xml | head -n 1)"
          test "$version" = "$cargo_version"
          test "$version" = "$decky_version"
          test "$version" = "$flatpak_version"

  container-image:
    needs: validate
    name: Container image (${{ matrix.platform }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
            artifact: amd64
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
            artifact: arm64
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/patrikthedev/hyperion-capture
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and publish OCI image
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packaging/podman/Containerfile
          platforms: ${{ matrix.platform }}
          outputs: type=image,name=ghcr.io/patrikthedev/hyperion-capture,push-by-digest=true,name-canonical=true,push=true
          labels: ${{ steps.metadata.outputs.labels }}
          build-args: |
            VERSION=${{ steps.metadata.outputs.version }}
            SOURCE_REVISION=${{ github.sha }}
          cache-from: type=gha,scope=container-${{ matrix.artifact }}
          cache-to: type=gha,mode=max,scope=container-${{ matrix.artifact }}

      - name: Export image digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: container-digest-${{ matrix.artifact }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  container-manifest:
    needs: container-image
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: container-digest-*
          path: /tmp/digests
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate image metadata
        id: metadata
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/patrikthedev/hyperion-capture
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Publish multi-architecture manifest
        working-directory: /tmp/digests
        env:
          IMAGE: ghcr.io/patrikthedev/hyperion-capture
          METADATA: ${{ steps.metadata.outputs.json }}
        run: |
          mapfile -t tags < <(jq -r '.tags[]' <<< "$METADATA")
          tag_args=()
          for tag in "${tags[@]}"; do
            tag_args+=(--tag "$tag")
          done

          digest_args=()
          for digest in *; do
            digest_args+=("$IMAGE@sha256:$digest")
          done

          docker buildx imagetools create "${tag_args[@]}" "${digest_args[@]}"

  release-artifacts:
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Install Flatpak build tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes flatpak flatpak-builder
          flatpak remote-add --user --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo
          flatpak install --user --noninteractive flathub \
            org.freedesktop.Platform//25.08 \
            org.freedesktop.Sdk//25.08 \
            org.freedesktop.Sdk.Extension.rust-stable//25.08

      - name: Build Flatpak bundle
        run: |
          flatpak-builder --force-clean --repo=flatpak-repo build-flatpak \
            packaging/flatpak/io.github.PatrikTheDev.HyperionCapture.yml
          flatpak build-bundle \
            --runtime-repo=https://flathub.org/repo/flathub.flatpakrepo \
            flatpak-repo \
            packaging/decky/bin/io.github.PatrikTheDev.HyperionCapture.flatpak \
            io.github.PatrikTheDev.HyperionCapture

      - uses: oven-sh/setup-bun@v2

      - name: Build Decky release archive
        run: |
          bun install --cwd packaging/decky --frozen-lockfile
          packaging/decky/build-package.sh

      - name: Build Podman setup archive and checksums
        run: |
          mkdir -p packaging/podman/out
          tar \
            --exclude=out \
            -C packaging/podman \
            -czf packaging/podman/out/HyperionCapture-podman.tar.gz \
            .
          sha256sum \
            packaging/decky/out/HyperionCapture.zip \
            packaging/decky/bin/io.github.PatrikTheDev.HyperionCapture.flatpak \
            packaging/podman/out/HyperionCapture-podman.tar.gz \
            > packaging/decky/out/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: HyperionCapture-${{ github.ref_name }}
          path: |
            packaging/decky/out/HyperionCapture.zip
            packaging/decky/bin/io.github.PatrikTheDev.HyperionCapture.flatpak
            packaging/podman/out/HyperionCapture-podman.tar.gz
            packaging/decky/out/SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            packaging/decky/out/HyperionCapture.zip
            packaging/decky/bin/io.github.PatrikTheDev.HyperionCapture.flatpak
            packaging/podman/out/HyperionCapture-podman.tar.gz
            packaging/decky/out/SHA256SUMS
