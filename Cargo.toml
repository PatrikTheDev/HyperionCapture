[workspace]
members = ["crates/hyperion-client", "crates/kms-egl"]
resolver = "3"

[workspace.package]
version = "0.0.3"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/PatrikTheDev/HyperionCapture"

[workspace.dependencies]
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "env"] }
flatbuffers = "25.12.19"
image = { version = "0.25", default-features = false, features = ["jpeg"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
url = { version = "2", features = ["serde"] }

[package]
name = "hyperion-capture"
description = "Compositor-independent Linux screen capture input for Hyperion"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
clap.workspace = true
hyperion-client = { path = "crates/hyperion-client" }
drm-fourcc = "2.2"
thiserror.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
url.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
caps = "0.5"
drm = "0.15"
kms-egl = { path = "crates/kms-egl" }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"

[lints]
workspace = true
