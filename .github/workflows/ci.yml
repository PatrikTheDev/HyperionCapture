name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Linux graphics build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install --yes libegl1-mesa-dev libgbm-dev libgl1-mesa-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy,rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-features
      - run: python3 -m unittest discover -s packaging/decky/tests

  decky:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: packaging/decky
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      - run: bun run build
